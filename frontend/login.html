<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Zack Real Estate</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      font-family: Arial, sans-serif;
    }

    /* ── Left panel: NYC skyline background ── */
    .login-left {
      flex: 1;
      background:
        linear-gradient(rgba(10, 28, 60, 0.75), rgba(10, 28, 60, 0.75)),
        url('/images/hero-nyc.png')
        center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: #fff;
      text-align: center;
    }

    .login-left-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
      justify-content: center;
    }

    .login-left-icon {
      width: 60px;
      height: 60px;
      background: #c9a84c;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Times New Roman', Times, serif;
      font-size: 24px;
      font-weight: 700;
      color: #0d2140;
      line-height: 1;
    }

    .login-left-icon span { font-size: 15px; }

    .login-left-name {
      font-family: 'Times New Roman', Times, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-align: left;
    }

    .login-left-sub {
      font-size: 11px;
      color: #c9a84c;
      letter-spacing: 2px;
      text-align: left;
    }

    .login-left h1 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 52px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 20px;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .login-left-divider {
      width: 56px;
      height: 3px;
      background: #c9a84c;
      margin: 0 auto 20px auto;
    }

    .login-left p {
      font-size: 17px;
      color: #d8e8f8;
      line-height: 1.7;
      max-width: 380px;
    }

    .login-left-tagline {
      margin-top: 40px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: #c9a84c;
      text-transform: uppercase;
    }

    /* ── Right panel: login form ── */
    .login-right {
      width: 440px;
      min-width: 380px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 48px;
    }

    .login-right h2 {
      font-family: 'Times New Roman', Times, serif;
      color: #0d2140;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .login-right .login-hint {
      color: #666;
      font-size: 14px;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .login-label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      display: block;
    }

    /* ── Password input wrapper ── */
    .pw-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .pw-wrapper input {
      width: 100%;
      padding: 14px 46px 14px 14px;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      color: #222;
    }

    .pw-wrapper input:focus {
      border-color: #0d2140;
    }

    .pw-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 18px;
      padding: 0;
      line-height: 1;
    }

    .pw-toggle:hover { color: #0d2140; }

    /* Caps lock warning */
    .caps-warning {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #7a5c00;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    .caps-warning.visible { display: flex; }

    /* Sign in button */
    .login-btn {
      width: 100%;
      padding: 15px;
      background: #0d2140;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      margin-bottom: 16px;
      transition: background 0.2s;
    }

    .login-btn:hover { background: #1a3a5c; }

    /* Error message */
    .login-error {
      display: none;
      color: #c0392b;
      background: #fdf0f0;
      border: 1px solid #f5c6c6;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 14px;
    }

    /* Back link */
    .back-link {
      display: block;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #c9a84c;
      text-decoration: none;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .back-link:hover { color: #0d2140; }

    /* ── Mobile: stack panels vertically ── */
    @media (max-width: 700px) {
      body { flex-direction: column; }
      .login-left {
        min-height: 240px;
        flex: none;
        padding: 32px 24px;
      }
      .login-left h1 { font-size: 32px; }
      .login-right {
        width: 100%;
        min-width: unset;
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Left: branding panel -->
  <div class="login-left">
    <div class="login-left-badge">
      <img src="/images/logo.png" alt="Zack Real Estate" style="height:110px;width:auto;display:block;margin:0 auto;">
    </div>

    <h1>Real Estate<br>Excellence</h1>
    <div class="login-left-divider"></div>
    <p>From Dream Homes to Landmark Deals,<br>We Make It Happen.</p>
    <div class="login-left-tagline">Admin Portal</div>
  </div>

  <!-- Right: login form -->
  <div class="login-right">
    <h2>Admin Sign In</h2>
    <p class="login-hint">Enter your password to access the admin panel.</p>

    <label class="login-label" for="admin-password">Password</label>

    <div class="pw-wrapper">
      <input
        type="password"
        id="admin-password"
        placeholder="Enter password"
        autocomplete="current-password"
      />
      <button class="pw-toggle" id="pw-toggle-btn" title="Show/hide password" tabindex="-1">
        <!-- Eye open icon -->
        <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <!-- Eye crossed (hidden) icon -->
        <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>

    <!-- Caps lock warning -->
    <div class="caps-warning" id="caps-warning">
      ⚠ Caps Lock is on
    </div>

    <!-- Error message -->
    <div class="login-error" id="login-error">
      Incorrect password. Please try again.
    </div>

    <button class="login-btn" onclick="handleLogin()">Sign In</button>

    <a href="/index.html" class="back-link">← Back to website</a>
  </div>

  <script>
    // If already logged in, skip straight to admin
    if (localStorage.getItem('adminToken') === 'zack-admin-verified') {
      window.location.href = '/admin.html';
    }

    // ── Show/hide password toggle ──
    document.getElementById('pw-toggle-btn').addEventListener('click', function () {
      const input   = document.getElementById('admin-password');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      document.getElementById('icon-eye-open').style.display = isHidden ? 'none'  : 'block';
      document.getElementById('icon-eye-off').style.display  = isHidden ? 'block' : 'none';
    });

    // ── Caps lock detection (only on real keyboard events, not autofill) ──
    document.getElementById('admin-password').addEventListener('keydown', (e) => {
      // e.key will be undefined or missing during autofill — skip those
      if (!e.key) return;
      const capsOn = e.getModifierState && e.getModifierState('CapsLock');
      document.getElementById('caps-warning').classList.toggle('visible', capsOn);
    });

    // Also hide caps warning when field loses focus
    document.getElementById('admin-password').addEventListener('blur', () => {
      document.getElementById('caps-warning').classList.remove('visible');
    });

    // ── Login handler ──
    async function handleLogin() {
      const password = document.getElementById('admin-password').value;
      const errorEl  = document.getElementById('login-error');
      errorEl.style.display = 'none';

      if (!password) return;

      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('adminToken', data.token);
        window.location.href = '/admin.html';
      } else {
        errorEl.style.display = 'block';
      }
    }

    // ── Allow Enter key to submit ──
    document.getElementById('admin-password')
      .addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
  </script>

</body>
</html>
